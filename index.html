<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP 아이디어 제안서 접수</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px 20%; }
        h1 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; min-width: 140px; }
        td { width: auto; }
        tr:nth-child(1) th, tr:nth-child(1) td,
        tr:nth-child(2) th:first-child,
        tr:nth-child(2) th:nth-child(3),
        tr:nth-child(3) th, tr:nth-child(3) td,
        tr:nth-child(4) th:first-child,
        tr:nth-child(5) th, tr:nth-child(5) td,
        tr:nth-child(6) th:first-child,
        tr:nth-child(7) th:first-child,
        tr:nth-child(8) th:first-child,
        tr:nth-child(9) th:first-child,
        tr:nth-child(10) th:first-child,
        tr:nth-child(11) th:first-child { text-align: center; }
        input, textarea, select { width: 100%; padding: 8px; box-sizing: border-box; }
        input[readonly] { background-color: #fafafa; color: #333; }
        .split-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .attachment-field { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .attachment-field button.secondary { width: auto; flex-shrink: 0; }
        .attachment-name { color: #333; word-break: break-all; }
        .attachment-input { display: none; }
        button { padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #45a049; }
        button.secondary { background-color: #555; }
        button.secondary:hover { background-color: #444; }
        .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .admin-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .message { min-height: 20px; margin-top: 12px; color: #333; }
        .message.error { color: #b00020; }
    </style>
</head>
<body>
    <h1>TOP 아이디어 제안서</h1>
    <form id="proposalForm">
        <table>
            <tr>
                <th>사번</th>
                <td><input type="text" name="employee_id"></td>
                <th>성명</th>
                <td><input type="text" name="proposer_name" required></td>
                <th>소속/직급</th>
                <td>
                    <div class="split-inputs">
                        <input type="text" name="department" placeholder="소속">
                        <input type="text" name="position" placeholder="직급">
                    </div>
                </td>
            </tr>
            <tr>
                <th>제안명</th>
                <td colspan="3"><input type="text" name="proposal_title" required></td>
                <th>제안일</th>
                <td><input type="date" name="proposal_date" id="proposalDateInput" readonly></td>
            </tr>
            <tr>
                <th>제안분야</th>
                <td colspan="5"><select name="proposal_category">
                    <option value="안전">안전</option>
                    <option value="설계">설계</option>
                    <option value="수행">수행</option>
                    <option value="외주">외주</option>
                    <option value="구매">구매</option>
                    <option value="기타">기타</option>
                </select></td>
            </tr>
            <tr>
                <th>현상 및 문제점</th>
                <td colspan="5"><textarea name="problem_statement" rows="5"></textarea></td>
            </tr>
            <tr>
                <th>제안안 설명<br>(개선 전/후)</th>
                <td colspan="5"><textarea name="first_reviewer" rows="5"></textarea></td>
            </tr>
            <tr>
                <th>유형효과</th>
                <td colspan="5"><textarea name="type_effect" rows="5"></textarea></td>
            </tr>
            <tr>
                <th>무형효과</th>
                <td colspan="5"><textarea name="intangible_effect" rows="5"></textarea></td>
            </tr>
            <tr>
                <th>제약조건</th>
                <td colspan="5"><textarea name="constraint_conditions" rows="5"></textarea></td>
            </tr>
            <tr>
                <th>투자비</th>
                <td colspan="5"><textarea name="investment_cost" rows="5"></textarea></td>
            </tr>
            <tr>
                <th>과제 수행 계획</th>
                <td colspan="5"><textarea name="proposal_plan" rows="5" required></textarea></td>
            </tr>
            <tr>
                <th>첨부파일</th>
                <td colspan="5">
                    <div class="attachment-field">
                        <input type="file" id="attachmentInput" name="attachment" class="attachment-input">
                        <button type="button" id="attachmentButton" class="secondary">파일 선택</button>
                        <span id="attachmentFileName" class="attachment-name">선택된 파일 없음</span>
                    </div>
                </td>
            </tr>
        </table>
        <br>
        <div class="actions">
            <button type="submit">제출</button>
            <div class="admin-actions">
                <button type="button" id="adminButton" class="secondary">관리자</button>
            </div>
        </div>
    </form>
    <div id="message" class="message" role="status"></div>
    <script>
        const form = document.getElementById('proposalForm');
        const adminButton = document.getElementById('adminButton');
        const attachmentInput = document.getElementById('attachmentInput');
        const attachmentButton = document.getElementById('attachmentButton');
        const attachmentFileName = document.getElementById('attachmentFileName');
        const proposalDateInput = document.getElementById('proposalDateInput');
        const message = document.getElementById('message');
        const API_BASE = '';

        const headers = [
            '사번', '성명', '소속', '직급', '제안명', '제안일', '제안분야',
            '현상 및 문제점', '제안안 설명', '유형효과', '무형효과',
            '제약조건', '투자비', '과제 수행 계획'
        ];
        const fieldMap = [
            ['employee_id', '사번'],
            ['proposer_name', '성명'],
            ['department', '소속'],
            ['position', '직급'],
            ['proposal_title', '제안명'],
            ['proposal_date', '제안일'],
            ['proposal_category', '제안분야'],
            ['problem_statement', '현상 및 문제점'],
            ['first_reviewer', '제안안 설명'],
            ['type_effect', '유형효과'],
            ['intangible_effect', '무형효과'],
            ['constraint_conditions', '제약조건'],
            ['investment_cost', '투자비'],
            ['proposal_plan', '과제 수행 계획']
        ];

        function setMessage(text, isError = false) {
            message.textContent = text;
            message.classList.toggle('error', isError);
        }

        function getTodayDateString() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function setProposalDate() {
            proposalDateInput.value = getTodayDateString();
        }

        setProposalDate();

        function getFormRow() {
            const data = new FormData(form);
            const row = fieldMap.reduce((result, [fieldName, label]) => {
                result[label] = data.get(fieldName) || '';
                return result;
            }, {});

            if (attachmentInput.files[0]) {
                row['첨부파일'] = attachmentInput.files[0].name;
            }

            return row;
        }

        function resetAttachmentField() {
            attachmentInput.value = '';
            attachmentFileName.textContent = '선택된 파일 없음';
        }

        attachmentButton.addEventListener('click', function() {
            attachmentInput.click();
        });

        attachmentInput.addEventListener('change', function() {
            attachmentFileName.textContent = attachmentInput.files[0]?.name || '선택된 파일 없음';
        });

        /** admin PDF용: 현재 표 레이아웃·입력값 그대로 HTML 문자열로 저장 */
        function captureIndexFormSnapshot() {
            const table = form.querySelector('table');
            const clone = table.cloneNode(true);

            clone.style.cssText =
                'width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px;font-family:Malgun Gothic,Arial,sans-serif;';
            clone.querySelectorAll('th').forEach((th) => {
                th.style.cssText =
                    'border:1px solid #ddd;padding:8px;background:#f2f2f2;text-align:center;vertical-align:middle;font-weight:bold;';
            });
            clone.querySelectorAll('td').forEach((td) => {
                td.style.cssText = 'border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top;word-break:break-word;';
            });

            clone.querySelectorAll('input, textarea, select').forEach((field) => {
                let displayText = '';
                if (field.type === 'file') {
                    displayText = field.files[0]?.name || '';
                } else if (field.tagName === 'SELECT') {
                    const opt = field.options[field.selectedIndex];
                    displayText = opt ? opt.text : field.value;
                } else {
                    displayText = field.value;
                }
                const block = document.createElement('div');
                block.style.cssText =
                    'white-space:pre-wrap;word-break:break-word;width:100%;box-sizing:border-box;min-height:1.2em;';
                block.textContent = displayText;
                field.replaceWith(block);
            });

            clone.querySelectorAll('.attachment-field button').forEach((button) => {
                button.remove();
            });

            const wrap = document.createElement('div');
            wrap.className = 'pdf-index-snapshot-root';
            wrap.style.cssText =
                'background:#fff;color:#000;box-sizing:border-box;width:794px;min-width:794px;max-width:794px;padding:20px;line-height:1.45;';
            const title = document.createElement('h2');
            title.textContent = 'TOP 아이디어 제안서';
            title.style.cssText = 'text-align:center;margin:0 0 16px;font-size:18px;font-weight:bold;';
            wrap.appendChild(title);
            wrap.appendChild(clone);
            return wrap.outerHTML;
        }

        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            setMessage('제출 내용을 저장하는 중입니다...');

            try {
                const row = getFormRow();
                row.__index_snapshot_html = captureIndexFormSnapshot();

                const formData = new FormData();
                formData.append('data', JSON.stringify({ data: row }));

                if (attachmentInput.files[0]) {
                    formData.append('attachment', attachmentInput.files[0]);
                }

                const response = await fetch(`${API_BASE}/api/submissions`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    const fields = Array.isArray(error.fields) ? ` (${error.fields.join(', ')})` : '';
                    throw new Error(`저장 요청이 실패했습니다.${fields}`);
                }

                form.reset();
                setProposalDate();
                resetAttachmentField();
                setMessage('제출 내용이 로컬 서버에 저장되었습니다.');
            } catch (error) {
                setMessage(`${error.message} 서버 주소를 http://서버PC_IP:8000 형태로 열었는지 확인해주세요.`, true);
            }
        });

        adminButton.addEventListener('click', function() {
            const password = window.prompt('관리자 비밀번호를 입력하세요.');

            if (password === 'topadmin') {
                sessionStorage.setItem('adminPassword', password);
                window.location.href = 'admin.html';
                return;
            }

            if (password !== null) {
                setMessage('비밀번호가 올바르지 않습니다.', true);
            }
        });
    </script>
</body>
</html>
