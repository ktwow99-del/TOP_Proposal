<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP 아이디어 제출 현황</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { text-align: center; }
        button { padding: 10px 20px; color: white; border: none; cursor: pointer; }
        button:hover { filter: brightness(0.94); }
        button.secondary { background-color: #555; }
        button.edit { background-color: #f59e0b; padding: 6px 12px; }
        button.delete { background-color: #c62828; padding: 6px 12px; }
        button.download-pdf { background-color: #2563eb; padding: 6px 12px; }
        .toolbar { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .message { min-height: 20px; margin-top: 12px; color: #333; }
        .message.error { color: #b00020; }
        .table-wrapper { margin-top: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: top; }
        th { background-color: #f2f2f2; min-width: 120px; text-align: center; }
        .no-cell { width: 60px; min-width: 60px; text-align: center; }
        .action-cell { min-width: 70px; text-align: center; white-space: nowrap; }
        .status-cell { min-width: 90px; text-align: center; white-space: nowrap; }
    </style>
</head>
<body>
    <h1>TOP 아이디어 제출 현황</h1>
    <div class="toolbar">
        <button type="button" id="excelButton" class="secondary">엑셀 다운로드</button>
        <button type="button" id="backButton" class="secondary">제안서 작성</button>
    </div>
    <div id="message" class="message" role="status"></div>
    <div id="submissionsTable" class="table-wrapper"></div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script>
        const API_BASE = '';
        const excelButton = document.getElementById('excelButton');
        const backButton = document.getElementById('backButton');
        const message = document.getElementById('message');
        const submissionsTable = document.getElementById('submissionsTable');
        let adminPassword = sessionStorage.getItem('adminPassword') || '';
        let loadedSubmissions = [];

        function setMessage(text, isError = false) {
            message.textContent = text;
            message.classList.toggle('error', isError);
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function nl2brEscaped(value) {
            return escapeHtml(value ?? '').replace(/\n/g, '<br>');
        }

        function sanitizeFilePart(value, fallback) {
            let s = String(value ?? '')
                .replace(/[\r\n\u2028\u2029]+/g, ' ')
                .replace(/[\\/:*?"<>|]+/g, '_')
                .trim();

            if (s.length > 120) {
                s = s.slice(0, 120);
            }

            return s || fallback;
        }

        /** 저장된 index 표 스냅샷이 있으면 사용, 없으면 필드로 표 재구성 */
        function buildPdfElementFromSubmission(submission) {
            const d = submission.data || {};
            const snap = d['__index_snapshot_html'];

            if (typeof snap === 'string' && snap.trim()) {
                const holder = document.createElement('div');
                holder.innerHTML = snap.trim();
                const root = holder.firstElementChild;

                if (root) {
                    root.style.setProperty('background', '#fff');
                    root.style.setProperty('color', '#000');
                    root.style.setProperty('box-sizing', 'border-box');
                    root.style.setProperty('width', '210mm');
                    root.style.setProperty('max-width', '210mm');
                    return root;
                }
            }

            return buildProposalPdfDom(submission);
        }

        /** index.html 제안서 표와 동일한 항목·배치 (스냅샷 없는 구 제출분용) */
        function buildProposalPdfDom(submission) {
            const d = submission.data || {};
            const wrap = document.createElement('div');
            const th = 'border:1px solid #ddd;padding:8px;background:#f2f2f2;text-align:center;vertical-align:middle;font-weight:bold;width:14%;';
            const td = 'border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top;word-break:break-word;';
            const L = (v) => nl2brEscaped(v);
            const S = (v) => escapeHtml(v ?? '');

            wrap.style.cssText =
                'font-family:Malgun Gothic,Arial,sans-serif;padding:20px;background:#fff;color:#000;' +
                'box-sizing:border-box;width:210mm;max-width:210mm;font-size:11px;line-height:1.45;';

            wrap.innerHTML = `
                <h2 style="text-align:center;margin:0 0 16px;font-size:18px;">TOP 아이디어 제안서</h2>
                <table style="width:100%;border-collapse:collapse;table-layout:fixed;">
                    <tr>
                        <th style="${th}">사번</th>
                        <td style="${td}">${S(d['사번'])}</td>
                        <th style="${th}">성명</th>
                        <td style="${td}">${S(d['성명'])}</td>
                        <th style="${th}">소속/직급</th>
                        <td style="${td}">${S(d['소속'])} / ${S(d['직급'])}</td>
                    </tr>
                    <tr>
                        <th style="${th}">제안명</th>
                        <td colspan="3" style="${td}">${S(d['제안명'])}</td>
                        <th style="${th}">제안일</th>
                        <td style="${td}">${S(d['제안일'])}</td>
                    </tr>
                    <tr>
                        <th style="${th}">제안분야</th>
                        <td colspan="5" style="${td}">${S(d['제안분야'])}</td>
                    </tr>
                    <tr>
                        <th style="${th}">현상 및 문제점</th>
                        <td colspan="5" style="${td}">${L(d['현상 및 문제점'])}</td>
                    </tr>
                    <tr>
                        <th style="${th}">제안안 설명<br>(개선 전/후)</th>
                        <td colspan="5" style="${td}">${L(d['제안안 설명'])}</td>
                    </tr>
                    <tr>
                        <th style="${th}">유형효과</th>
                        <td colspan="5" style="${td}">${L(d['유형효과'])}</td>
                    </tr>
                    <tr>
                        <th style="${th}">무형효과</th>
                        <td colspan="5" style="${td}">${L(d['무형효과'])}</td>
                    </tr>
                    <tr>
                        <th style="${th}">제약조건</th>
                        <td colspan="5" style="${td}">${L(d['제약조건'])}</td>
                    </tr>
                    <tr>
                        <th style="${th}">투자비</th>
                        <td colspan="5" style="${td}">${L(d['투자비'])}</td>
                    </tr>
                    <tr>
                        <th style="${th}">과제 수행 계획</th>
                        <td colspan="5" style="${td}">${L(d['과제 수행 계획'])}</td>
                    </tr>
                </table>
            `;

            return wrap;
        }

        function getJsPdfConstructor() {
            if (window.jspdf && typeof window.jspdf.jsPDF === 'function') {
                return window.jspdf.jsPDF;
            }

            if (window.jspdf && typeof window.jspdf.default === 'function') {
                return window.jspdf.default;
            }

            return null;
        }

        /** 캔버스(긴 이미지)를 A4 여러 페이지에 나눠 붙임 */
        function addImageCanvasToPdf(pdf, canvas, marginMm) {
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const imgData = canvas.toDataURL('image/png');
            const imgWidthMm = pageWidth - marginMm * 2;
            const imgHeightMm = (canvas.height * imgWidthMm) / canvas.width;
            const pageInnerHeight = pageHeight - marginMm * 2;

            let heightLeft = imgHeightMm;
            let y = marginMm;

            pdf.addImage(imgData, 'PNG', marginMm, y, imgWidthMm, imgHeightMm);
            heightLeft -= pageInnerHeight;

            while (heightLeft > 0) {
                y = marginMm - (imgHeightMm - heightLeft);
                pdf.addPage();
                pdf.addImage(imgData, 'PNG', marginMm, y, imgWidthMm, imgHeightMm);
                heightLeft -= pageInnerHeight;
            }
        }

        async function downloadOriginalPdf(submission) {
            if (typeof html2canvas !== 'function') {
                setMessage('html2canvas를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.', true);
                return;
            }

            const JsPDF = getJsPdfConstructor();

            if (!JsPDF) {
                setMessage('jsPDF를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.', true);
                return;
            }

            const d = submission.data || {};
            const el = buildPdfElementFromSubmission(submission);
            /* flex 안에서 너비 0으로 수축하면 html2canvas가 빈 이미지를 만듦 → 고정 폭 블록 */
            el.style.display = 'block';
            el.style.width = '794px';
            el.style.minWidth = '794px';
            el.style.maxWidth = '794px';
            el.style.margin = '0 auto';
            el.style.boxSizing = 'border-box';
            el.style.boxShadow = '0 4px 24px rgba(0, 0, 0, 0.12)';

            const veil = document.createElement('div');
            veil.style.cssText =
                'position:fixed;inset:0;background:rgba(255,255,255,0.94);z-index:2147483646;' +
                'overflow:auto;padding:24px;box-sizing:border-box;';
            veil.appendChild(el);

            const notice = document.createElement('div');
            notice.textContent = 'PDF를 생성하는 중입니다…';
            notice.style.cssText =
                'position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:2147483647;' +
                'font:14px Malgun Gothic,sans-serif;background:#1e293b;color:#fff;padding:10px 18px;border-radius:8px;';

            document.body.appendChild(veil);
            document.body.appendChild(notice);

            const dateRaw = d['제안일'] || (submission.submitted_at || '').split(/\s+/)[0] || '';
            const datePart = sanitizeFilePart(dateRaw, '날짜미상');
            const titlePart = sanitizeFilePart(d['제안명'], '제안명');
            const filename = `${datePart}_${titlePart}.pdf`;

            try {
                await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                await new Promise((resolve) => setTimeout(resolve, 200));

                const canvas = await html2canvas(el, {
                    scale: 2,
                    useCORS: true,
                    logging: false,
                    backgroundColor: '#ffffff'
                });

                if (!canvas.width || !canvas.height) {
                    throw new Error('empty canvas');
                }

                const pdf = new JsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
                addImageCanvasToPdf(pdf, canvas, 10);
                pdf.save(filename);
                setMessage('PDF를 다운로드했습니다.');
            } catch (error) {
                console.error(error);
                setMessage('PDF 생성에 실패했습니다.', true);
            } finally {
                notice.remove();
                veil.remove();
            }
        }

        function renderSubmissions(submissions) {
            if (!submissions.length) {
                loadedSubmissions = [];
                submissionsTable.innerHTML = '<p>저장된 제출 내역이 없습니다.</p>';
                return;
            }

            const tableColumns = [
                { header: 'NO', getValue: (submission) => submission.id, className: 'no-cell' },
                { header: '제안일', getValue: (submission) => submission.data['제안일'] },
                { header: '사번', getValue: (submission) => submission.data['사번'] },
                { header: '성명', getValue: (submission) => submission.data['성명'] },
                { header: '제안명', getValue: (submission) => submission.data['제안명'] }
            ];
            loadedSubmissions = [...submissions].sort((a, b) => Number(a.id || 0) - Number(b.id || 0));
            const rows = loadedSubmissions.map((submission) => {
                const dataCells = tableColumns.map((column) => {
                    const value = column.getValue(submission);
                    const cellClass = column.className ? ` class="${column.className}"` : '';
                    return `<td${cellClass}>${escapeHtml(value || '')}</td>`;
                }).join('');
                const downloadCell = `
                    <td class="action-cell">
                        <button type="button" class="download-pdf download-pdf-submission" data-id="${escapeHtml(submission.id)}">다운로드</button>
                    </td>
                `;
                const editCell = `
                    <td class="action-cell">
                        <button type="button" class="edit edit-submission" data-id="${escapeHtml(submission.id)}">수정</button>
                    </td>
                `;
                const deleteCell = `
                    <td class="action-cell">
                        <button type="button" class="delete delete-submission" data-id="${escapeHtml(submission.id)}">삭제</button>
                    </td>
                `;
                const statusCell = `<td class="status-cell">${escapeHtml(getCompletionText(submission))}</td>`;

                return `<tr>${dataCells}${downloadCell}${editCell}${deleteCell}${statusCell}</tr>`;
            }).join('');

            submissionsTable.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            ${tableColumns.map((column) => {
                                const cellClass = column.className ? ` class="${column.className}"` : '';
                                return `<th${cellClass}>${escapeHtml(column.header)}</th>`;
                            }).join('')}
                            <th>원본 다운로드</th>
                            <th>수정</th>
                            <th>삭제</th>
                            <th class="status-cell">수정상태</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function getCompletionText(submission) {
            return submission.edit_completed ? '수정완료' : '';
        }

        function downloadExcel() {
            if (!loadedSubmissions.length) {
                setMessage('다운로드할 제출 내역이 없습니다.', true);
                return;
            }

            const excelColumns = [
                { header: 'NO', getValue: (submission) => submission.id },
                { header: 'Code', getValue: (submission) => submission.data['Code'] },
                { header: '본부', getValue: (submission) => submission.data['본부'] },
                { header: '사업장', getValue: (submission) => submission.data['사업장'] },
                { header: '사번', getValue: (submission) => submission.data['사번'] },
                { header: '직급', getValue: (submission) => submission.data['직급'] },
                { header: '소속', getValue: (submission) => submission.data['소속'] },
                { header: '성명', getValue: (submission) => submission.data['성명'] },
                { header: '제안일', getValue: (submission) => submission.data['제안일'] },
                { header: '검토담당', getValue: (submission) => submission.data['(참고) 검토담당'] },
                { header: '1차 검토 담당자', getValue: (submission) => submission.data['1차 검토 담당자'] },
                { header: '대분류', getValue: (submission) => submission.data['제안분야'] },
                { header: '중분류', getValue: (submission) => submission.data['중분류'] },
                { header: '소분류', getValue: (submission) => submission.data['소분류'] },
                { header: '제안 제목', getValue: (submission) => submission.data['제안명'] },
                { header: '제안 내용 상세', getValue: (submission) => getProposalDetail(submission) },
                { header: '수정상태', getValue: getCompletionText }
            ];
            const headerCells = excelColumns
                .map((column) => `<Cell ss:StyleID="Header"><Data ss:Type="String">${escapeXml(column.header)}</Data></Cell>`)
                .join('');
            const bodyRows = loadedSubmissions
                .map((submission) => {
                    const cells = excelColumns
                        .map((column) => {
                            const value = normalizeExcelText(column.getValue(submission));
                            return `<Cell ss:StyleID="Cell"><Data ss:Type="String">${escapeXml(value)}</Data></Cell>`;
                        })
                        .join('');

                    return `<Row>${cells}</Row>`;
                })
                .join('');

            const excelXml = `<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
    xmlns:o="urn:schemas-microsoft-com:office:office"
    xmlns:x="urn:schemas-microsoft-com:office:excel"
    xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
    <Styles>
        <Style ss:ID="Header">
            <Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="0"/>
            <Font ss:Bold="1"/>
            <Interior ss:Color="#F2F2F2" ss:Pattern="Solid"/>
            <Borders>
                <Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/>
                <Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/>
                <Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/>
                <Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/>
            </Borders>
        </Style>
        <Style ss:ID="Cell">
            <Alignment ss:Vertical="Top" ss:WrapText="0"/>
            <NumberFormat ss:Format="@"/>
            <Borders>
                <Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/>
                <Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/>
                <Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/>
                <Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/>
            </Borders>
        </Style>
    </Styles>
    <Worksheet ss:Name="제출현황">
        <Table>
            <Row>${headerCells}</Row>
            ${bodyRows}
        </Table>
    </Worksheet>
</Workbook>`;

            const blob = new Blob(['\ufeff', excelXml], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'TOP_아이디어_제출현황.xls';
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
            setMessage('엑셀 파일을 다운로드했습니다.');
        }

        function getProposalDetail(submission) {
            const data = submission.data || {};

            if (data['제안 내용 상세']) {
                return data['제안 내용 상세'];
            }

            const detailFields = [
                '현상 및 문제점',
                '제안안 설명',
                '유형효과',
                '무형효과',
                '제약조건',
                '투자비',
                '과제 수행 계획'
            ];

            return detailFields
                .map((field) => {
                    const value = data[field] || '';
                    return value ? `[${field}] ${value}` : '';
                })
                .filter(Boolean)
                .join(' ');
        }

        function normalizeExcelText(value) {
            return String(value ?? '')
                .replace(/[\r\n\u2028\u2029]+/g, ' ')
                .replace(/\t+/g, ' ')
                .replace(/\s{2,}/g, ' ')
                .trim();
        }

        function escapeXml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        }

        async function ensureAdminPassword() {
            if (adminPassword) {
                return true;
            }

            const password = window.prompt('관리자 비밀번호를 입력하세요.');

            if (password === 'topadmin') {
                adminPassword = password;
                sessionStorage.setItem('adminPassword', password);
                return true;
            }

            if (password !== null) {
                setMessage('비밀번호가 올바르지 않습니다.', true);
            }

            return false;
        }

        async function loadSubmissions() {
            const hasPassword = await ensureAdminPassword();

            if (!hasPassword) {
                return;
            }

            setMessage('제출 현황을 불러오는 중입니다...');

            try {
                const response = await fetch(`${API_BASE}/api/submissions`, {
                    headers: { 'X-Admin-Password': adminPassword }
                });

                if (!response.ok) {
                    throw new Error('목록 요청이 실패했습니다.');
                }

                const submissions = await response.json();
                renderSubmissions(submissions);
                setMessage(`총 ${submissions.length}건의 제출 내역을 불러왔습니다.`);
            } catch (error) {
                setMessage('제출 현황을 불러오지 못했습니다.', true);
            }
        }

        backButton.addEventListener('click', function() {
            window.location.href = 'index.html';
        });

        excelButton.addEventListener('click', downloadExcel);

        submissionsTable.addEventListener('click', async function(event) {
            const downloadButton = event.target.closest('.download-pdf-submission');

            if (downloadButton) {
                const id = downloadButton.dataset.id;
                const submission = loadedSubmissions.find((item) => String(item.id) === String(id));

                if (submission) {
                    setMessage('PDF를 생성하는 중입니다...');
                    await downloadOriginalPdf(submission);
                }

                return;
            }

            const editButton = event.target.closest('.edit-submission');

            if (editButton) {
                window.location.href = `edit.html?id=${encodeURIComponent(editButton.dataset.id)}`;
                return;
            }

            const deleteButton = event.target.closest('.delete-submission');

            if (!deleteButton) {
                return;
            }

            const id = deleteButton.dataset.id;

            if (!window.confirm('이 제출 내역을 삭제하시겠습니까?')) {
                return;
            }

            setMessage('제출 내역을 삭제하는 중입니다...');

            try {
                const response = await fetch(`${API_BASE}/api/submissions/${encodeURIComponent(id)}`, {
                    method: 'DELETE',
                    headers: { 'X-Admin-Password': adminPassword }
                });

                if (!response.ok) {
                    throw new Error('삭제 요청이 실패했습니다.');
                }

                await loadSubmissions();
            } catch (error) {
                setMessage('제출 내역을 삭제하지 못했습니다.', true);
            }
        });

        loadSubmissions();
    </script>
</body>
</html>
